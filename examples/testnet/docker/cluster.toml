# HFT Cluster Configuration - Testnet (Notional MM V2)
# Tests notional_mm_live with v2 configs on Binance Futures Testnet

[cluster]
name = "hft-testnet-v2"
data_dir = "/var/lib/hft/data"
log_dir = "/var/lib/hft/logs"
socket_path = "/tmp/hft-supervisor.sock"
config_reload_interval_secs = 10

# ============================================
# Connector - Binance Futures Testnet
# (PAPI not available on testnet)
# ============================================

[[connectors]]
name = "bf"
type = "binancefutures"
config_file = "/etc/hft/deploy/connector.toml"
auto_start = true

# ============================================
# Collector
# ============================================
[collector]
enabled = true
mode = "ipc"
output_dir = "/var/lib/hft/data"
symbols = ["bobusdt", "brusdt", "compusdt"]
retention_days = 3
auto_start = true

# ============================================
# Order Recorder (ClickHouse)
# ============================================
[order_recorder]
enabled = true
auto_start = true
ipc_service = "hft_recording"
clickhouse_url = "http://clickhouse:8123"
database = "hft"
batch_size = 100
flush_interval_secs = 5
max_publishers = 8

# ============================================
# Warmup Configuration
# ============================================
[warmup]
data_dir = "/var/lib/hft/data"
max_age_seconds = 86400
min_duration_seconds = 0     # notional_mm self-warms from live data, no NPZ needed

[bot_defaults]

# ============================================
# Bots - Notional MM on Testnet
# 3 symbols with exact tick_size match to testnet
# ============================================

[[bots]]
id = "mm_bobusdt"
enabled = true
strategy = "notional_mm_live"
symbol = "bobusdt"
connector = "bf"
config_file = "/etc/hft/symbols/bob.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

[[bots]]
id = "mm_brusdt"
enabled = true
strategy = "notional_mm_live"
symbol = "brusdt"
connector = "bf"
config_file = "/etc/hft/symbols/br.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

[[bots]]
id = "mm_compusdt"
enabled = true
strategy = "notional_mm_live"
symbol = "compusdt"
connector = "bf"
config_file = "/etc/hft/symbols/comp.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5
