# HFT Cluster Configuration - Testnet
# For testing the supervisor with Binance Futures Testnet

[cluster]
name = "testnet-binance-futures"
data_dir = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/data"
log_dir = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/logs"
socket_path = "/tmp/hft-supervisor-testnet.sock"
config_reload_interval_secs = 10

[connector]
name = "bf"
type = "binancefutures"
config_file = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/config/binancefutures_testnet.toml"
auto_start = false  # Don't auto-start, control via API

[collector]
enabled = true
mode = "ipc"
output_dir = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/data"
symbols = ["btcusdt"]
retention_days = 7
auto_start = false  # Don't auto-start, control via API

# Order recorder is optional - disabled for testnet
# [order_recorder]
# enabled = false

[warmup]
data_dir = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/data"
max_age_seconds = 86400      # 24 hours for testnet (more lenient)
min_duration_seconds = 60    # 1 minute minimum (for testing)

[bot_defaults]
tick_size = 0.1
lot_size = 0.001

[[bots]]
id = "obi_mm_btcusdt_testnet"
enabled = true
strategy = "obi_mm_testnet"
symbol = "btcusdt"
config_file = "/home/b0qi/bookdisco/hftbacktest/examples/testnet/config/obi_mm_testnet.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5
