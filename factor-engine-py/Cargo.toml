[package]
name = "factor_engine_py"
version = "0.1.0"
edition = "2024"

[lib]
name = "factor_engine_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
ndarray = "0.16"
factor-engine = { path = "../factor-engine" }
hftbacktest = { path = "../hftbacktest", default-features = false, features = ["backtest"] }
rayon = "1.10"

[workspace]
