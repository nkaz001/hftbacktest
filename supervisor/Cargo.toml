[package]
name = "hft-supervisor"
version = "0.1.0"
edition = "2021"
description = "HFT Bot Supervisor - Process lifecycle management for trading bots"

[[bin]]
name = "hft-supervisor"
path = "src/main.rs"

[[bin]]
name = "hftctl"
path = "src/hftctl.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# File watching
notify = "6"

# Process management
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unix socket IPC
tokio-stream = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# JSON for IPC messages
serde_json = "1"

# Glob for file matching
glob = "0.3"
