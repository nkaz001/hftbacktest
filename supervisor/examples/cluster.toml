# HFT Cluster Configuration
# Copy to /etc/hft/cluster.toml and customize for your environment

[cluster]
name = "prod-binance-futures"
data_dir = "/var/lib/hft/data"
log_dir = "/var/log/hft"
socket_path = "/run/hft/supervisor.sock"
config_reload_interval_secs = 30

[connector]
name = "bf"
type = "binancefutures"
config_file = "/etc/hft/connector/binancefutures.toml"

[collector]
enabled = true
mode = "ipc"
output_dir = "/var/lib/hft/data/raw"
symbols = ["btcusdt", "ethusdt", "solusdt"]
retention_days = 30

[warmup]
data_dir = "/var/lib/hft/data/raw"
max_age_seconds = 7200       # 2 hours - data must be newer than this
min_duration_seconds = 3600  # 1 hour - must have at least this much data

[bot_defaults]
tick_size = 0.1
lot_size = 0.001

# Example bot configurations
# Each bot runs as a separate process

[[bots]]
id = "obi_mm_btcusdt"
enabled = true
strategy = "obi_mm"
symbol = "btcusdt"
config_file = "/etc/hft/strategies/obi_mm_btcusdt.toml"
auto_restart = true
max_restarts = 5
restart_backoff_secs = 10

[[bots]]
id = "obi_mm_ethusdt"
enabled = true
strategy = "obi_mm"
symbol = "ethusdt"
config_file = "/etc/hft/strategies/obi_mm_ethusdt.toml"

[[bots]]
id = "obi_mm_solusdt"
enabled = false  # Disabled - won't start automatically
strategy = "obi_mm"
symbol = "solusdt"
config_file = "/etc/hft/strategies/obi_mm_solusdt.toml"
