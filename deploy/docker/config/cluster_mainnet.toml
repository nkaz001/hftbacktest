# HFT Cluster Configuration - Mainnet (Real Trading)
# Bybit Linear Futures - Production Deployment

[cluster]
name = "hft-bybit-mainnet"
data_dir = "/var/lib/hft/data"
log_dir = "/var/lib/hft/logs"
socket_path = "/tmp/hft-supervisor.sock"
config_reload_interval_secs = 10

# ============================================
# Connectors - Bybit Mainnet Only
# ============================================

[[connectors]]
name = "bybit"
type = "bybit"  # WebSocket Trade stream for lower latency
config_file = "/etc/hft/bybit_mainnet.toml"
auto_start = true
# Enable position/income sync to order-recorder
recording_service = "hft_recording"
position_sync_interval = 5
income_sync_interval = 60

# ============================================
# Collector
# ============================================
[collector]
enabled = true
mode = "ipc"
output_dir = "/var/lib/hft/data"
# Bybit uses UPPERCASE symbols
symbols = ["BTCUSDT", "ETHUSDT", "ADAUSDT"]
retention_days = 7
auto_start = true

# ============================================
# Order Recorder (ClickHouse)
# ============================================
[order_recorder]
enabled = true
auto_start = true
ipc_service = "hft_recording"
clickhouse_url = "http://clickhouse:8123"
database = "hft"
batch_size = 100
flush_interval_secs = 5
max_publishers = 16

# ============================================
# Warmup Configuration
# ============================================
[warmup]
data_dir = "/var/lib/hft/data"
max_age_seconds = 86400
min_duration_seconds = 1800  # 30 minutes to match factor window size

[bot_defaults]
tick_size = 0.1
lot_size = 0.001

# ============================================
# Bots - Start with BTC only for testing
# ============================================

[[bots]]
id = "obi_mm_btcusdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "BTCUSDT"
connector = "bybit"
config_file = "/etc/hft/strategies/obi_mm_btc_mainnet.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

[[bots]]
id = "obi_mm_ethusdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "ETHUSDT"
connector = "bybit"
config_file = "/etc/hft/strategies/obi_mm_eth_mainnet.toml"
tick_size = 0.01
lot_size = 0.01
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

[[bots]]
id = "obi_mm_adausdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "ADAUSDT"
connector = "bybit"
config_file = "/etc/hft/strategies/obi_mm_ada_mainnet.toml"
tick_size = 0.0001
lot_size = 1.0
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5
