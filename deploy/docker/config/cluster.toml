# HFT Cluster Configuration - Docker
# Multi-bot deployment with 3 symbols

[cluster]
name = "hft-docker"
data_dir = "/var/lib/hft/data"
log_dir = "/var/lib/hft/logs"
socket_path = "/tmp/hft-supervisor.sock"
config_reload_interval_secs = 10

[connector]
name = "bf"
type = "binancefutures"
config_file = "/etc/hft/binancefutures.toml"
auto_start = true

[collector]
enabled = true
mode = "ipc"
output_dir = "/var/lib/hft/data"
symbols = ["btcusdt", "ethusdt", "solusdt"]
retention_days = 7
auto_start = true

[order_recorder]
enabled = true
auto_start = true
ipc_service = "hft_recording"
clickhouse_url = "http://clickhouse:8123"
database = "hft"
batch_size = 100
flush_interval_secs = 5

[warmup]
data_dir = "/var/lib/hft/data"
max_age_seconds = 86400
min_duration_seconds = 60

[bot_defaults]
tick_size = 0.1
lot_size = 0.001

# ============================================
# Bot 1: BTC/USDT OBI Market Making
# ============================================
[[bots]]
id = "obi_mm_btcusdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "btcusdt"
config_file = "/etc/hft/strategies/obi_mm_btc.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

# ============================================
# Bot 2: ETH/USDT OBI Market Making
# ============================================
[[bots]]
id = "obi_mm_ethusdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "ethusdt"
config_file = "/etc/hft/strategies/obi_mm_eth.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5

# ============================================
# Bot 3: SOL/USDT OBI Market Making
# ============================================
[[bots]]
id = "obi_mm_solusdt"
enabled = true
strategy = "obi_mm_testnet"
symbol = "solusdt"
config_file = "/etc/hft/strategies/obi_mm_sol.toml"
auto_restart = true
max_restarts = 3
restart_backoff_secs = 5
