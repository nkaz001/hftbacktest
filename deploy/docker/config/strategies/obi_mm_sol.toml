# OBI MM Strategy Configuration - SOL/USDT
# Optimized for Solana trading (higher volatility)

[global]
order_qty = 1.0          # ~$200 per order at $200 SOL
max_position = 10.0      # ~$2000 max position
grid_num = 2             # 2 orders each side
grid_interval = 0.05     # $0.05 grid spacing
roi_lb = 0.0
roi_ub = 1000.0

[params]
looking_depth = 0.001    # 0.1% depth for OBI calculation
window = 5               # Z-score window
volatility_window = 2    # Volatility window
half_spread = 0.0008     # 8 bps half spread (SOL more volatile)
skew = 0.01              # Position skew factor
c1 = 0.0001              # OBI impact coefficient
power = 1.0              # Volatility power
live_seconds = 30.0      # Order lifetime
update_interval_ns = 5000000000      # 5 seconds
volatility_interval_ns = 10000000000 # 10 seconds

[stop_loss]
volatility_mean = 0.012
volatility_std = 0.005
change_mean = 0.003
change_std = 0.008
volatility_threshold = 3.0
change_threshold = 3.0
