version: "3.8"

# Docker Compose for Mainnet Trading (Bybit)
# Usage: docker compose -f docker-compose.mainnet.yml up -d

services:
  hft:
    image: ghcr.io/bookdisco/hftbacktest:${HFT_IMAGE_TAG:-latest}
    container_name: hft-mainnet
    hostname: hft-mainnet
    restart: unless-stopped
    environment:
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_SECRET=${BYBIT_SECRET}
      - CLUSTER_CONFIG=/etc/hft/deploy/cluster.toml
      - CLICKHOUSE_URL=http://clickhouse:8123
      - RUST_LOG=info
    env_file:
      - .env.mainnet
    # Port exposed via nginx reverse proxy
    expose:
      - "3000"
    volumes:
      # Per-server config (cluster.toml + connector.toml)
      - ${HFT_DEPLOYMENT_DIR:-./config}:/etc/hft/deploy:ro
      # Shared symbol configs
      - ${HFT_SYMBOLS_DIR:-./config/symbols}:/etc/hft/symbols:ro
      # Entrypoint override (until next image rebuild)
      - ./entrypoint.sh:/entrypoint.sh:ro
      # Persistent data storage
      - ./data:/var/lib/hft/data
      - ./logs:/var/lib/hft/logs
    # Use tmpfs for iceoryx2 IPC state to ensure clean state on restart
    # This prevents "ServiceInCorruptedState" errors after container restart
    tmpfs:
      - /tmp/iceoryx2:mode=1777,uid=999,gid=999
    # Increase shared memory for iceoryx2
    shm_size: '256mb'
    networks:
      - hft-network
    depends_on:
      clickhouse:
        condition: service_healthy
    # Use host network for lower latency (optional)
    # network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hft-clickhouse-mainnet
    hostname: clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ClickHouse configuration
    environment:
      - CLICKHOUSE_DB=hft
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_MAX_MEMORY_USAGE=2000000000
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: hft-grafana-mainnet
    hostname: grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Port exposed via nginx reverse proxy
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      # Subpath configuration - Grafana handles /grafana/ prefix
      - GF_SERVER_ROOT_URL=https://hft.bookdisco.space/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - hft-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: hft-nginx-mainnet
    hostname: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hft-network
    depends_on:
      - hft
      - grafana
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hft-network:
    driver: bridge

volumes:
  clickhouse-data:
  grafana-data:
