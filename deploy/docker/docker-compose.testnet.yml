version: "3.8"

# Docker Compose for Testnet E2E Testing (Notional MM V2)
# Usage:
#   1. Build image: docker build -f deploy/docker/Dockerfile -t hft:testnet .
#   2. Run: cd deploy/docker && docker compose -f docker-compose.testnet.yml --env-file .env.testnet up -d
#   3. Dashboard: http://localhost:3001
#   4. Grafana: http://localhost:3001/grafana/

services:
  hft:
    image: ${HFT_IMAGE:-hft:testnet}
    container_name: hft-testnet
    hostname: hft-testnet
    restart: unless-stopped
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET=${BINANCE_SECRET}
      - CLUSTER_CONFIG=/etc/hft/deploy/cluster.toml
      - CLICKHOUSE_URL=http://clickhouse:8123
      - RUST_LOG=info
      - NO_AUTH=1
    expose:
      - "3000"
    volumes:
      # Testnet deployment config
      - ${HFT_DEPLOYMENT_DIR:-../../examples/testnet/docker}:/etc/hft/deploy:ro
      # V2 symbol configs
      - ${HFT_SYMBOLS_DIR:-../../submodules/hft-configs/symbols/binance_mm_v2}:/etc/hft/symbols:ro
      # Entrypoint
      - ./entrypoint.sh:/entrypoint.sh:ro
      # Data
      - testnet-data:/var/lib/hft/data
      - testnet-logs:/var/lib/hft/logs
    tmpfs:
      - /tmp/iceoryx2:mode=1777,uid=999,gid=999
    shm_size: '256mb'
    networks:
      - testnet
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hft-clickhouse-testnet
    hostname: clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse-testnet:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    networks:
      - testnet
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - CLICKHOUSE_DB=hft
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

  grafana:
    image: grafana/grafana:11.4.0
    container_name: hft-grafana-testnet
    hostname: grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - grafana-testnet:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3001/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - testnet

  nginx:
    image: nginx:alpine
    container_name: hft-nginx-testnet
    hostname: nginx
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ${HFT_DEPLOYMENT_DIR:-../../examples/testnet/docker}/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - testnet
    depends_on:
      - hft
      - grafana

networks:
  testnet:
    driver: bridge

volumes:
  clickhouse-testnet:
  grafana-testnet:
  testnet-data:
  testnet-logs:
