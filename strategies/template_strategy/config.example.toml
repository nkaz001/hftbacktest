# Template Strategy Configuration
#
# Copy this file and modify for your specific strategy.
# All parameters have sensible defaults - only override what you need.

# =============================================================================
# Global Settings
# =============================================================================
[global]
# Order quantity per trade (in base currency, e.g., BTC)
# Must be above exchange minimum (Binance Futures: ~$100 notional)
order_qty = 0.002

# Maximum position size (absolute value)
# Strategy will stop placing new orders when position exceeds this
max_position = 0.02

# Number of orders per side for grid-style strategies
# Set to 1 for simple market making
grid_num = 3

# Price tick size (exchange-specific)
# Binance Futures BTCUSDT: 0.1
tick_size = 0.1

# Minimum order quantity (lot size)
# Binance Futures BTCUSDT: 0.001
lot_size = 0.001

# =============================================================================
# Strategy Parameters
# =============================================================================
[params]
# Half spread from mid price
# 0.0005 = 0.05% = 5 basis points each side
# Total spread = 2 * half_spread = 10 bps
half_spread = 0.0005

# Position skew factor for inventory management
# Higher value = more aggressive inventory reduction
# 0.01 means 1% price adjustment per unit of position
skew = 0.01

# Order lifetime in seconds
# Orders older than this will be cancelled and replaced
order_lifetime_secs = 30.0

# Strategy update interval in nanoseconds
# 5_000_000_000 = 5 seconds
# Lower value = more responsive but higher load
update_interval_ns = 5000000000

# =============================================================================
# Risk Management (Optional)
# =============================================================================
[risk]
# Maximum daily loss before stopping (in quote currency, e.g., USDT)
# Uncomment to enable
# max_daily_loss = 100.0

# Maximum drawdown percentage before stopping
# Uncomment to enable
# max_drawdown_pct = 5.0

# Kill switch - set to true to immediately stop all trading
# Useful for emergency situations
kill_switch = false
