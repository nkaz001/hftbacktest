[package]
name = "template_strategy"
version = "0.1.0"
edition = "2021"
description = "Template strategy for HFT system - copy and modify for your own strategy"

# Rename the binary to your strategy name
[[bin]]
name = "template_strategy"
path = "src/main.rs"

[dependencies]
# Core HFT library with live trading support
hftbacktest = { path = "../../hftbacktest", features = ["live"] }

# Factor computation (OBI, volatility, etc.)
factor-engine = { path = "../../factor-engine" }

# Order recording (optional - for ClickHouse integration)
order-recorder = { path = "../../order-recorder" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration parsing
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Time handling
chrono = "0.4"

[features]
default = []
# Enable order recording to ClickHouse
recording = []
