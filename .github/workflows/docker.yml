name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: sha-<short_sha>)'
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bookdisco/hftbacktest

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Setup SSH for private submodules
        env:
          FACTOR_ENGINE_KEY: ${{ secrets.FACTOR_ENGINE_DEPLOY_KEY }}
          HFT_STRATEGIES_KEY: ${{ secrets.HFT_STRATEGIES_DEPLOY_KEY }}
          HFT_CONFIGS_KEY: ${{ secrets.HFT_CONFIGS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$FACTOR_ENGINE_KEY" > ~/.ssh/factor_engine
          echo "$HFT_STRATEGIES_KEY" > ~/.ssh/hft_strategies
          echo "$HFT_CONFIGS_KEY" > ~/.ssh/hft_configs
          chmod 600 ~/.ssh/factor_engine ~/.ssh/hft_strategies ~/.ssh/hft_configs

          cat >> ~/.ssh/config <<'SSHEOF'
          Host fe.github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/factor_engine
            IdentitiesOnly yes
          Host hs.github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/hft_strategies
            IdentitiesOnly yes
          Host hc.github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/hft_configs
            IdentitiesOnly yes
          SSHEOF

          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          # Route each submodule to its dedicated deploy key via host alias
          git config --global url."git@fe.github.com:bookdisco/factor-engine".insteadOf "git@github.com:bookdisco/factor-engine"
          git config --global url."git@hs.github.com:bookdisco/hft-strategies".insteadOf "git@github.com:bookdisco/hft-strategies"
          git config --global url."git@hc.github.com:bookdisco/hft-configs".insteadOf "git@github.com:bookdisco/hft-configs"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules via SSH
        run: git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
